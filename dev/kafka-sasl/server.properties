# 单节点 KRaft，只为验「探针的 SASL 报文能不能被真 broker 接受」。
# 比上一版少了：TLS 那条 listener、证书生成、多 listener 端口渲染。
#
# 内网 listener 固定 PLAINTEXT（单节点不需要 broker 自己跟自己做 SASL），
# 管理面（kafka-configs）也走它 —— 这张网只绑 127.0.0.1，别照抄到真实环境。

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:19097
controller.listener.names=CONTROLLER

listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
listeners=CONTROLLER://:19097,INTERNAL://:19092,PLAINTEXT://:19093,SASL_PLAINTEXT://:19094
advertised.listeners=INTERNAL://kafka:19092,PLAINTEXT://localhost:9093,SASL_PLAINTEXT://localhost:9092
inter.broker.listener.name=INTERNAL

############################# SASL #############################
sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512

# PLAIN 的静态用户写在 JAAS 里；SCRAM 的凭据由 run.sh 用 kafka-configs 写进元数据。
# 联调口径：三种机制共用一个密码，夹具只要一份。
listener.name.sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_wist-probe="wist-plain-secret";
listener.name.sasl_plaintext.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

############################# 存储 / 主题 #############################
log.dirs=/tmp/kraft-combined-logs
num.partitions=1
auto.create.topics.enable=true
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
