[package]
name = "wist-agentd"
version = "0.10.1" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"

[dependencies]
globset = "0.4"
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
jumo-derive = "0.1"
orion-error = { version = "0.9", features = ["derive", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 升级时校验制品摘要、判版本方向、取包 —— 全在**底座** crate `wist-artifact`（不在发布域）：
# 被管端只需要「拿下来 / 核摘要 / 判方向」，不该背发布域概念，也不该多出解包依赖（flate2/tar）。
wist-artifact = { version = "0.1" }
#wist-artifact = { version = "0.1" }
# agent 本地身份材料（mTLS 客户端证书）：密钥对**本地生成、不出本机**，只把 CSR 交上去。
rcgen = "0.13"
# 从本地证书读 `notAfter` 做**本地**过期自检（服务端在握手期就拒过期证书，给不出错误码）。
x509-parser = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# diagnose 的证书主机名自检：reqwest 拿不到对端证书，所以单独开一次只读 TLS 握手把叶证书读出来。
# 与网关共用同一套 rustls；不参与真实请求，真实信任判定仍由 `network.control_plane` 负责。
rustls = "0.23"
tokio-rustls = "0.26"
# 注：不写 `webpki-roots` —— 0.13 里 TLS 根由 `rustls`（rustls-platform-verifier，系统根）决定；
# 而 `webpki-roots` 只是可选依赖的隐式 feature（reqwest 源码并不引用它），0.13.5 已把它去掉，
# 留着会把本仓**钉死在 0.13.1**（任何 forward 更新都解析失败）。
# 事实摘要的内容摘要（`fact-v1:sha256:…`）现在只有一份实现，在 `wist-contracts::fact_summary`
# （sha2）。agentd 只转接，所以这里不再直依赖任何哈希库。
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "1.1"
tokio = { version = "1.48", features = ["full"] }
wist-contracts = { version = "0.9" }
#wist-contracts = { version = "0.8", path = "../wist-contracts" }
# 跨进程 seam 报文（enrollment / agent_status / gateway / work / agent_uplink）。CI/发布走 registry；本地联调可改用下面注释的 path 行。
wist-api = { version = "0.9" }
#wist-api = { version = "0.8", path = "../wist-api" }
wist-metrics = { version = "0.5" }
#wist-metrics = { version = "0.5", path = "../wist-metrics" }
wist-shared = { version = "0.2" }
# 运行日志：`log` 门面 + 共享 crate `wist-log`（级别 / 格式 / 落点 / 轮转 统一口径）。
# env_logger 由 `wist-log` 内部装配，本仓不直依赖。
log = "0.4"
wist-log = { version = "0.1" }
#wist-log = { version = "0.1", path = "../wist-log" }
wist-validate = { version = "0.6" }
#wist-validate = { version = "0.5", path = "../wist-validate" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "wist-agentd"
path = "src/main.rs"

[[bin]]
name = "wist-exec"
path = "src/bin/wist-exec/main.rs"

# 升级执行体：与 agentd 同 crate（版本天然锁在一起），但作为**独立二进制**发布 ——
# 它必须能在 agentd 被换掉的窗口里活着（等新版起来 / 失败回滚），不能进 exec 的生命周期管理。
[[bin]]
name = "wist-upgrader"
path = "src/bin/wist-upgrader.rs"

[dev-dependencies]
# 只为 e2e 造**独立的**摘要夹具：测试里要有一个不经被测实现（现在在 `wist-artifact`）算出来的
# 预期值，否则「两边用同一个错实现」会让测试白过。生产代码不用它。
sha2 = "0.10"

# 本地联调：与 `wist-contracts` 同期改动时，取消下面两行的注释 ——
# `[patch]` 放在这里（而不是逐条改依赖行），是为了让 api/metrics/validate 也解析到本地版本。
# [patch.crates-io]
# wist-contracts = { path = "../wist-contracts" }

