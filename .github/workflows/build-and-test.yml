name: Build & Test

on:
  push:
    branches:
      # `*` 不匹配 `/`：写成 `*` 时 `feat/xxx` / `fix/xxx` 这些分支**不会**触发。
      - "**"
  pull_request:
    types: [opened, reopened]
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

# 主机流记录（` FLOW: ` 帧）的 BPF 对象是**构建期**用 clang 编进制品的（`build.rs`）。
# 版本钉在 `dev/ci/flow-clang.txt`（**单一来源**）：换 runner 镜像时只改那个文件，
# 两个工作流里所有 install / CLANG / 断言都从它读。
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # 主机流记录的 BPF 对象是构建期编进去的（`build.rs` + clang）。装了它，
      # Linux 的 test 构建才会真的把 `telemetry/flows/linux.rs` 与 `flow.bpf.c` 编进来 —— 
      # 否则那块代码在 CI 里完全不参与编译，回归只能靠真机。
      - name: Install clang (flow eBPF collector)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          CLANG_BIN="$(cat dev/ci/flow-clang.txt)"
          sudo apt-get update
          sudo apt-get install -y "$CLANG_BIN"
          "$CLANG_BIN" --version

      - name: Cargo fmt
        run: cargo fmt --check

      # macOS 上这两个变量无意义也不报错：`build.rs` 看到 target_os != linux 直接返回，
      # 所以同一个步骤两个平台共用，不用按 os 分叉。
      - name: Cargo build (release)
        run: |
          export CLANG="$(cat dev/ci/flow-clang.txt)"
          # Linux 上**必须**编进采集器：缺 clang 就让构建失败（见 `build.rs`）。
          export WIST_REQUIRE_FLOW_BPF=1
          cargo build --release --all

      - name: Cargo test (release)
        run: |
          export CLANG="$(cat dev/ci/flow-clang.txt)"
          export WIST_REQUIRE_FLOW_BPF=1
          cargo test --release --all

  # 主机流记录（eBPF/tc）的**真内核**验收：需要 root + tc + 一张有默认路由的网卡。
  # 单测证明不了的那一层：BPF 对象在真内核上能过 verifier、tc 挂得上、真流量能被聚合，
  # 停采/撤授权能把在途窗口按 `partial` 发出去。
  # 环境不满足（非 root / 无默认路由 / 内核太老）时用例自己打印 `skip:` 并返回 ——
  # 这里把它变成**明确的 SKIP 告警**，而不是假绿（与 journal-contract / log-acceptance 同口径）。
  flow-ebpf:
    name: Host flow (real eBPF)
    runs-on: ubuntu-24.04
    # 真机用例自身已有 30s 的收帧上限；这层是兜底：作业永远不会再挂到
    # 被人手动取消（曾经 netlink 路径挂死 20 分钟）。
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install clang / iproute2
        run: |
          set -euo pipefail
          CLANG_BIN="$(cat dev/ci/flow-clang.txt)"
          # runner 镜像本身就带 clang 与 iproute2：有就直接用，不必碰 apt。
          if command -v "$CLANG_BIN" >/dev/null && command -v tc >/dev/null; then
            echo "already present: $("$CLANG_BIN" --version | head -1) / $(tc -V | head -1)"
            exit 0
          fi
          # 镜像里的第三方源（packages.microsoft.com 等）偶发 403，会让整条
          # `apt-get update` 非零退出，把「装 clang」连坐弄红。这条作业只需要
          # ubuntu 主仓里的 clang / iproute2，先把第三方源摘掉再更新。
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update
          sudo apt-get install -y "$CLANG_BIN" iproute2

      - name: Build tests
        run: |
          set -euo pipefail
          export CLANG="$(cat dev/ci/flow-clang.txt)"
          export WIST_REQUIRE_FLOW_BPF=1
          # 把路径交给下一步：那里不能再调一次 cargo ——
          # 没有 CLANG/WIST_REQUIRE_FLOW_BPF 的重建会把采集器从二进制里去掉（build.rs 会重跑）。
          BIN=$(cargo test --release --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable // empty' | tail -1)
          echo "test binary: $BIN"
          echo "FLOW_TEST_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Run flow tests on the real NIC (as root)
        run: |
          set -o pipefail
          BIN="$FLOW_TEST_BIN"
          echo "test binary: $BIN"
          # 先留下环境快照：内核/网卡/默认路由决定「该看哪张网卡」与 attach 走的路径。
          uname -r
          ip -br link
          ip route show default || true

          # 两条 attach 路径都要跑：默认（6.6+ 走 TCX）与强制 netlink
          # （老内核的那条路 —— 它才是有“崩溃残留”问题的那一条）。
          rc=0
          for mode in tcx netlink; do
            echo "=== attach path: $mode ==="
            set +e
            # `timeout` + `stdbuf -oL`：卡住要变成“明确的失败”，而不是让日志
            # 一直看不到卡在哪条用例（stdout 接管道是块缓冲，不强制行缓冲就只会看到半行）。
            sudo env "PATH=$PATH" WIST_FLOW_TC="$mode" timeout 300 \
              stdbuf -oL -eL "$BIN" flows --ignored --nocapture --test-threads=1 \
              2>&1 | tee "$RUNNER_TEMP/flows-$mode.log"
            mode_rc=${PIPESTATUS[0]}
            set -e
            if [ "$mode_rc" -ne 0 ]; then
              rc="$mode_rc"
            fi
          done

          {
            echo "### 主机流记录（真 eBPF）"
            echo ""
            echo "- 退出码：\`$rc\`"
            echo "- attach 路径：TCX + netlink"
            if [ "$rc" -ne 0 ]; then
              echo ""
              echo "失败/超时的最后 40 行："
              echo '```'
              tail -n 40 "$RUNNER_TEMP"/flows-*.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ] && grep -qh '^skip:' "$RUNNER_TEMP"/flows-*.log; then
            echo "::warning::runner 环境无法验证 eBPF（缺 root / 网卡 / 内核能力），部分用例被跳过（这不是“通过”）"
          fi
          exit "$rc"

  # 内核日志导出器（W3）的**真 journald** 验收：不需要编译，所以单开一个 job，
  # 也不用等 Rust 缓存。验的是「agentd 对 journalctl 的假设」：
  # 一行一条 JSON / `__CURSOR` 可取 / 续读不重放 / 畸形游标措辞 / `-p 4` 过滤。
  # 环境采不到内核日志时脚本退 77：这里当**明确的 SKIP**（写进 step summary + 告警），
  # 而不是硬红（硬红会逼人加 `if: false`，比告警更容易被永久忽略）。
  journal-contract:
    name: Journal contract (real journald)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify journalctl contract
        run: |
          set +e
          sudo env WIST_VERIFY_ALLOW_SKIP=1 dev/verify-journal-exporter.sh
          rc=$?
          set -e
          {
            echo "### journal 契约（真 journald）"
            echo ""
            echo "- 退出码：\`$rc\`（0 = 通过且无 SKIP，77 = 环境无法验证）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 77 ]; then
            echo "::warning::runner 采不到内核日志，journal 契约被跳过（这不是“通过”）"
            exit 0
          fi
          exit "$rc"

  # 日志采集（W1–W4 / G1–G3）的**真文件系统**验收。验的是单测证明不了的那一层：
  #   * glob / symlink / realpath / inode 轮转（容器场景就是 symlink 指向 pod 文件）；
  #   * checkpoint 跨**进程**续读（重启不重放、不丢行）；
  #   * 噪音行丢弃且不占 `seq`；
  #   * `postgres_csv` 引号内换行跨读批、`mysql_slow` 的 `# Time:` 分块；
  #   * 写到一半的记录（torn write）按 Oversized 挡下并清掉 pending。
  # 不验数据面解析（log_type / 字段抽取），那是另一层的责任。
  # 只在 Linux 跑：脚本在 macOS 也能过（本地已验），但两个平台跑只是时长翻倍。
  log-acceptance:
    name: Log acceptance (real filesystem)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # 需要 wist-contracts 0.9.5 已发布（见 CHANGELOG 升级提示）：agentd 0.9.1 用到
      # 本轮新增的能力轴，否则这里会因契约版本不够而编译失败。
      # 必须**所有 bin**（`--bins`）：agentd 从自己的目录旁边找 `wist-exec`，
      # 只编 `--bin wist-agentd` 会让它在启动时报 `exec bin unavailable`。
      - name: Cargo build (release)
        run: cargo build --release --bins

      - name: Verify log collection on real files
        env:
          WIST_AGENTD_BIN: ${{ github.workspace }}/target/release/wist-agentd
          WIST_ACCEPT_ALLOW_SKIP: "1"
        run: |
          set +e
          bash dev/verify-log-acceptance.sh
          rc=$?
          set -e
          {
            echo "### 日志采集验收（真文件系统）"
            echo ""
            echo "- 退出码：\`$rc\`（0 = 通过，1 = 有 FAIL，77 = 环境无法验证）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 77 ]; then
            echo "::warning::runner 环境无法验证日志采集（缺 python3？），本次验收被跳过（这不是“通过”）"
            exit 0
          fi
          exit "$rc"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --test-threads=1
          echo "Coverage file generated:"
          ls -la lcov.info
          echo "File size: $(wc -c < lcov.info) bytes"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          flags: unittests
          name: coverage-${{ github.ref_name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          verbose: true
