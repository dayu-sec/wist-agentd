name: Build & Test

on:
  push:
    branches:
      - "*"
  pull_request:
    types: [opened, reopened]
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo build (release)
        run: cargo build --release --all

      - name: Cargo test (release)
        run: cargo test --release --all

  # 内核日志导出器（W3）的**真 journald** 验收：不需要编译，所以单开一个 job，
  # 也不用等 Rust 缓存。验的是「agentd 对 journalctl 的假设」：
  # 一行一条 JSON / `__CURSOR` 可取 / 续读不重放 / 畸形游标措辞 / `-p 4` 过滤。
  # 环境采不到内核日志时脚本退 77：这里当**明确的 SKIP**（写进 step summary + 告警），
  # 而不是硬红（硬红会逼人加 `if: false`，比告警更容易被永久忽略）。
  journal-contract:
    name: Journal contract (real journald)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify journalctl contract
        run: |
          set +e
          sudo env WIST_VERIFY_ALLOW_SKIP=1 dev/verify-journal-exporter.sh
          rc=$?
          set -e
          {
            echo "### journal 契约（真 journald）"
            echo ""
            echo "- 退出码：\`$rc\`（0 = 通过且无 SKIP，77 = 环境无法验证）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 77 ]; then
            echo "::warning::runner 采不到内核日志，journal 契约被跳过（这不是“通过”）"
            exit 0
          fi
          exit "$rc"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --test-threads=1
          echo "Coverage file generated:"
          ls -la lcov.info
          echo "File size: $(wc -c < lcov.info) bytes"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          flags: unittests
          name: coverage-${{ github.ref_name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          verbose: true
