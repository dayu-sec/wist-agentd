name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 出 **静态 musl**：制品被抽出到宿主原生运行，不能绑宿主 glibc 版本。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cargo build
        # ring 等 C 依赖按 target 取 CC；Rust 侧链接器指向 musl-gcc 才能真静态。
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CC_aarch64_unknown_linux_musl: musl-gcc
          AR_aarch64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          set -euo pipefail
          ARTIFACT="wist-agentd-${{ github.ref_name }}-${{ matrix.target }}"
          BIN_DIR="target/${{ matrix.target }}/release"
          # 三件必须一起发：wist-upgrader 正是去换 agentd 自己的那个进程，缺一件就没有「同版本」前提。
          # 网关下发的安装脚本会**当场拒收**漏件制品（agent package is missing wist-upgrader），
          # 所以这里打前查可执行、打后查包内，与 dev/package-agentd.sh 同一口径。
          # 包内一层同名目录（与 dev 打包一致；安装脚本用 find 找件，不依赖目录名）。
          BINS="wist-agentd wist-exec wist-upgrader"
          mkdir -p "${ARTIFACT}"
          for bin in ${BINS}; do
            test -x "${BIN_DIR}/${bin}" || { echo "拒绝打出漏件制品：${BIN_DIR}/${bin} 缺失或不可执行" >&2; exit 1; }
            cp -av "${BIN_DIR}/${bin}" "${ARTIFACT}/"
          done
          # 升级兼容声明随包走（网关录入时读它；缺了只是“兼容性未知”，有它才能拦住旧网关）。
          test -f compat.json || { echo "拒绝发布：仓根缺 compat.json" >&2; exit 1; }
          cp -av compat.json "${ARTIFACT}/compat.json"
          tar -czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          # 验包内三件 + compat.json：**不要**用 `tar tzf | grep -q` —— grep -q 命中即退出会关掉管道，
          # GNU tar 会报 `stdout: write error`，配上 pipefail 就变成“包里没有”的误判
          # （Linux runner 上真踩了；macOS 的 BSD tar 不报，所以本地跑不出来）。
          # 先整份取回再 case 匹配，与 dev/package-agentd.sh 的 verify_contents 同口径。
          LISTED="$(tar tzf "${ARTIFACT}.tar.gz")"
          for bin in ${BINS} compat.json; do
            case "${LISTED}" in
              *"/${bin}"*) echo "包内 ${bin} ✓" ;;
              *) echo "拒绝发布：${ARTIFACT}.tar.gz 里没有 ${bin}" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${LISTED}"   # 把包内清单打进 CI 日志（复用上面已取回的那份，不再跑一遍 tar）
          ls -lh "${ARTIFACT}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-agentd-${{ github.ref_name }}-${{ matrix.target }}
          path: wist-agentd-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-matrix]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wist-agentd-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # alpha/beta 通道标为 prerelease（不占 “latest”）；stable 才是正式版。
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

  # 可选：把本仓制品推到腾讯云 COS（对象存储），供中心 / CDN / 客户端按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整段自动跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-guangzhou）、可选 COS_PREFIX（默认取仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：<COS_PREFIX>/<tag>/<文件名> 与 <COS_PREFIX>/latest/<文件名>
  # 每个对象带自定义元数据 x-cos-meta-artifact-sha256=<hex>（COS 只存 MD5 ETag，sha256 得自带）。
  upload-cos:
    name: Upload artifacts to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          # coscli 只打印汇总，失败明细落在 coscli_output/<时间>/ 下；失败时打印并输出为 annotation。
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          shopt -s nullglob
          files=(pkg/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            name="$(basename "${f}")"
            # COS 对象只存 MD5（ETag），GitHub 侧资产 digest（sha256）过不来。把 sha256 作为
            # **对象自定义元数据**写进对象本身（x-cos-meta-artifact-sha256 —— 与设计里的
            # artifact_sha256 字段同名）—— 随对象走，录 COS 地址时可用 `coscli stat`（HEAD）
            # 读回填 expected_sha256（`ls` 不返回自定义元数据）。--meta 形如 key:value（多个用 # 分隔）。
            # 本 step 只有 `set -eu`（无 pipefail），管道失败会被 cut 吃掉；空摘要等于又「丢」了，
            # 故显式兜一道。
            sha="$(sha256sum "${f}" | cut -d' ' -f1)"
            [ -n "${sha}" ] || { echo "::error::无法计算 ${name} 的 sha256" >&2; exit 1; }
            meta="x-cos-meta-artifact-sha256:${sha}"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/${TAG}/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（${TAG}）"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/latest/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（latest）"
            echo "已上传 ${name}  sha256=${sha}"
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"
