name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          set -euo pipefail
          ARTIFACT="wist-agentd-${{ github.ref_name }}-${{ matrix.target }}"
          BIN_DIR="target/${{ matrix.target }}/release"
          # 三件必须一起发：wist-upgrader 正是去换 agentd 自己的那个进程，缺一件就没有「同版本」前提。
          # 网关下发的安装脚本会**当场拒收**漏件制品（agent package is missing wist-upgrader），
          # 所以这里打前查可执行、打后查包内，与 dev/package-agentd.sh 同一口径。
          # 包内一层同名目录（与 dev 打包一致；安装脚本用 find 找件，不依赖目录名）。
          BINS="wist-agentd wist-exec wist-upgrader"
          mkdir -p "${ARTIFACT}"
          for bin in ${BINS}; do
            test -x "${BIN_DIR}/${bin}" || { echo "拒绍打出漏件制品：${BIN_DIR}/${bin} 缺失或不可执行" >&2; exit 1; }
            cp -av "${BIN_DIR}/${bin}" "${ARTIFACT}/"
          done
          tar -czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          for bin in ${BINS}; do
            tar tzf "${ARTIFACT}.tar.gz" | grep -q "/${bin}$" || { echo "拒绍发布：${ARTIFACT}.tar.gz 里没有 ${bin}" >&2; exit 1; }
          done
          tar tzf "${ARTIFACT}.tar.gz"
          ls -lh "${ARTIFACT}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-agentd-${{ github.ref_name }}-${{ matrix.target }}
          path: wist-agentd-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-matrix]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wist-agentd-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
