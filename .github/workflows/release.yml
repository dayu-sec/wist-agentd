name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 发版前先把测试跑完：**测试不过就不发制品**。
  #
  # 为什么 release.yml 自己也要跑一遍：`build-and-test.yml` 是**另一个 workflow**，
  # 它的红不会拦住本 workflow 的发布。2026-11-28 事故：`v0.45.0-alpha` 的 Build & Test
  # 红着（`tests/local_exec` 一条用例还按旧行为断言），制品却已经发布出去了，只能补发 patch。
  #
  # 只跑一台 ubuntu：它是二进制的规范构建平台；两 OS 矩阵仍由 `build-and-test.yml` 负责
  # （那次失败在 linux / macOS 上**同时**出现，所以一台就够当闸门）。
  test:
    name: Test before publishing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # 主机流记录的 BPF 对象是**构建期**用 clang 编进去的（`build.rs`）。
      # 不装就会在 Linux 上被 `WIST_REQUIRE_FLOW_BPF=1` 判失败 —— 与 `build-and-test.yml` 同口径。
      - name: Install clang (flow eBPF collector)
        run: |
          set -euo pipefail
          CLANG_BIN="$(cat dev/ci/flow-clang.txt)"
          sudo apt-get update
          sudo apt-get install -y "$CLANG_BIN"
          "$CLANG_BIN" --version

      - name: Cargo fmt
        run: cargo fmt --check

      # 与 `build-and-test.yml` 同口径（`--release --all`）：**不要**用 `--lib` 子集。
      # `tests/` 下的集成用例只有 `--all` 才会跑，而它们正是最容易跟着行为改动一起漂的那一批。
      - name: Cargo test
        run: |
          export CLANG="$(cat dev/ci/flow-clang.txt)"
          export WIST_REQUIRE_FLOW_BPF=1
          cargo test --release --all

  build-matrix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 出 **静态 musl**：制品被抽出到宿主原生运行，不能绑宿主 glibc 版本。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          if command -v musl-gcc >/dev/null; then
            echo "already present: $(musl-gcc --version | head -1)"
            exit 0
          fi
          # 与 clang 同口径：第三方源偶发 403 会把 `apt-get update` 弄成非零退出。
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # 流记录采集器的 BPF 对象是**构建期**用 clang 编进制品的（`build.rs`）。
      # 版本钉在 `dev/ci/flow-clang.txt`（**单一来源**，两个工作流共用）：
      # 换 runner 镜像时只改那个文件。BPF 对象的字节不随机器漂；
      # 镜像升级丢了这个包会**装包失败**，比静默出一个“没有采集器”的制品容易发现得多。
      - name: Install clang (flow eBPF collector)
        if: contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          CLANG_BIN="$(cat dev/ci/flow-clang.txt)"
          # 镜像本身带 clang 时直接用；否则先摘掉第三方源（它们偶发 403，会把
          # 整条 `apt-get update` 弄成非零退出，连坐掉这一步）。与 build-and-test 同口径。
          if ! command -v "$CLANG_BIN" >/dev/null; then
            sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
            sudo apt-get update
            sudo apt-get install -y "$CLANG_BIN"
          fi
          "$CLANG_BIN" --version

      - name: Cargo build
        # aws-lc-sys（rustls 的加密后端）等 C 依赖按 target 取 CC；Rust 侧链接器指向 musl-gcc
        # 才能真静态。macOS 交叉构建见 docs/design/metrics-collection-runtime.md §12.3。
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CC_aarch64_unknown_linux_musl: musl-gcc
          AR_aarch64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          # Linux 制品**必须**带上采集器：clang 不在就让构建失败（`build.rs`）。
          # macOS 制品上这两个变量无意义也不报错（build.rs 看到 target_os != linux 直接返回）。
          export CLANG="$(cat dev/ci/flow-clang.txt)"
          export WIST_REQUIRE_FLOW_BPF=1
          cargo build --release --target ${{ matrix.target }}

      # 制品断言（双保险）：`build.rs` 已经会因缺 clang 失败，这里再从**成品**里
      # 找一遘三个只可能来自 BPF 对象的符号（程序名 + map 名）。
      - name: Assert the flow collector is embedded
        if: contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/wist-agentd"
          for sym in flow_egress flow_ingress flow_map; do
            if ! strings "$BIN" | grep -qx "$sym"; then
              echo "::error::artifact 里找不到 $sym：本次构建没带上流记录采集器（见 docs/design/host-ebpf-flow-collection.md §9.5）"
              exit 1
            fi
          done
          echo "flow collector: embedded ✓"

      # 熵源门禁：CI runner 的内核都是新的，直接跑制品**永远复现不出**「老内核没有
      # getrandom(2)」那类故障（发布 0.34.0 就是这么漏出去的：CentOS 6 上任何 TLS 都
      # `getentropy failed.` + SIGABRT）。这里用 seccomp 把 getrandom() 变成 ENOSYS，
      # 再让制品跑一次会握手的 TLS，把那条路径逼出来。
      - name: Entropy self-check on a simulated pre-3.17 kernel
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/wist-agentd"

          # 1) seccomp 包装器（只依赖内核头文件，不装 libseccomp）
          cc -O2 -o "$RUNNER_TEMP/no-getrandom" dev/ci/no_getrandom_exec.c

          # 2) 一个真实的 TLS 监听：握手第一步就要取熵（client random + key share），
          #    所以只要握手开始，取熵路径就一定被走到。
          #    先看一眼制品走的是 aws-lc 的哪条取熵分支：只有 getentropy 分支才需要我们的
          #    /dev/urandom 回退（musl-gcc 看不到 <linux/random.h> 时就是它）。
          if strings "$BIN" | grep -q 'getentropy failed'; then
            echo 'artifact 走 aws-lc 的 getentropy 分支（老内核必须靠我们的 /dev/urandom 回退）'
          else
            echo '::warning::artifact 走 aws-lc 的 urandom 分支（构建机可见 <linux/random.h>）；本次不覆盖 getentropy 回退'
          fi
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" >/dev/null 2>&1
          openssl s_server -accept 127.0.0.1:18443 \
            -cert "$RUNNER_TEMP/cert.pem" -key "$RUNNER_TEMP/key.pem" -quiet &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          # 3) 用**制品本身**跑一次会握手的命令（默认配置 + 打开控制面）
          CONF="$RUNNER_TEMP/conf"
          mkdir -p "$CONF"
          "$BIN" init-config --stdout >"$CONF/agentd.toml"
          cat >>"$CONF/agentd.toml" <<'TOML'

          [control_plane]
          enabled = true
          endpoint = "https://127.0.0.1:18443"
          tls_mode = "https"
          TOML

          set +e
          timeout 90 "$RUNNER_TEMP/no-getrandom" "$BIN" enroll \
            --token ci-entropy-gate --config-dir "$CONF" >"$RUNNER_TEMP/out" 2>&1
          rc=$?
          set -e
          sed 's/^/  | /' "$RUNNER_TEMP/out"

          # 4) 反例断言：不许 abort（134 = SIGABRT），也不许出现那条遗言
          if [ "$rc" = "134" ] || grep -q 'getentropy failed' "$RUNNER_TEMP/out"; then
            echo '::error::制品在没有 getrandom(2) 的内核上会 abort（getentropy failed / SIGABRT）'
            exit 1
          fi
          if [ "$rc" = "124" ]; then
            echo '::error::制品在没有 getrandom(2) 的内核上卡住了（TLS 取不到熵）'
            exit 1
          fi
          # 5) 正向断言：必须真走到了 TLS（证书/握手类错误），而不是更早就退出了 ——
          #    否则门禁会因为「没跑到那段代码」而假绿。
          if ! grep -Eiq 'certificate|tls|handshake|证书|握手' "$RUNNER_TEMP/out"; then
            echo '::error::没有走到 TLS 阶段（看不到证书/握手相关错误），门禁无效'
            exit 1
          fi
          echo '熵源回退 OK：没有 getrandom(2) 也能完成 TLS 初始化'

      - name: Package artifacts
        env:
          # 只有 musl 目标要求静态；macOS 制品按系统 dylib 动态链接是正常的。
          TARGET_IS_MUSL: ${{ contains(matrix.target, 'musl') }}
        run: |
          set -euo pipefail
          ARTIFACT="wist-agentd-${{ github.ref_name }}-${{ matrix.target }}"
          BIN_DIR="target/${{ matrix.target }}/release"
          # 三件必须一起发：wist-upgrader 正是去换 agentd 自己的那个进程，缺一件就没有「同版本」前提。
          # 网关下发的安装脚本会**当场拒收**漏件制品（agent package is missing wist-upgrader），
          # 所以这里打前查可执行、打后查包内，与 dev/package-agentd.sh 同一口径。
          # 包内一层同名目录（与 dev 打包一致；安装脚本用 find 找件，不依赖目录名）。
          BINS="wist-agentd wist-exec wist-upgrader"
          mkdir -p "${ARTIFACT}"
          for bin in ${BINS}; do
            test -x "${BIN_DIR}/${bin}" || { echo "拒绝打出漏件制品：${BIN_DIR}/${bin} 缺失或不可执行" >&2; exit 1; }
            cp -av "${BIN_DIR}/${bin}" "${ARTIFACT}/"
          done
          # musl 制品必须是**静态**链接。制品会被抽到宿主原生运行，一旦绑上构建机或宿主的
          # 任何动态库（glibc、libgcc_s…），现场就是 `Restarting (127)`：容器起来又倒、日志里
          # 只有一行加载器错误。0.40.9 的 libgcc_s 事故正是这么漏出去的。
          # 这件事必须由 CI 对**当次产物**自证：事后人工下载复核依赖网络、也依赖人没忘。
          # 不用 `file … | grep -q`（命中即退出会关掉管道，配 pipefail 会变成误判）；
          # 与下面 LISTED 同口径：先整份取回再 case 匹配。
          if [ "${TARGET_IS_MUSL}" = "true" ]; then
            for bin in ${BINS}; do
              desc="$(file -b "${BIN_DIR}/${bin}")"
              case "${desc}" in
                # 两种都算静态：普通静态，**以及静态 PIE**。Rust 在 x86_64-musl 上默认开 PIE，
                # file 吐的是 `static-pie linked`；aarch64-musl 上则是 `statically linked`。
                # 判据是「没有绑动态库」，不是「没有 PIE」—— PIE 不影响制品可移植性。
                *"statically linked"*|*"static-pie linked"*) echo "静态链接 ${bin} ✓（${desc}）" ;;
                *) echo "拒绝发布：${bin} 不是静态链接 —— ${desc}" >&2; exit 1 ;;
              esac
            done
          fi
          # 升级兼容声明随包走（网关录入时读它；缺了只是“兼容性未知”，有它才能拦住旧网关）。
          test -f compat.json || { echo "拒绝发布：仓根缺 compat.json" >&2; exit 1; }
          cp -av compat.json "${ARTIFACT}/compat.json"
          tar -czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          # 验包内三件 + compat.json：**不要**用 `tar tzf | grep -q` —— grep -q 命中即退出会关掉管道，
          # GNU tar 会报 `stdout: write error`，配上 pipefail 就变成“包里没有”的误判
          # （Linux runner 上真踩了；macOS 的 BSD tar 不报，所以本地跑不出来）。
          # 先整份取回再 case 匹配，与 dev/package-agentd.sh 的 verify_contents 同口径。
          LISTED="$(tar tzf "${ARTIFACT}.tar.gz")"
          for bin in ${BINS} compat.json; do
            case "${LISTED}" in
              *"/${bin}"*) echo "包内 ${bin} ✓" ;;
              *) echo "拒绝发布：${ARTIFACT}.tar.gz 里没有 ${bin}" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${LISTED}"   # 把包内清单打进 CI 日志（复用上面已取回的那份，不再跑一遍 tar）
          ls -lh "${ARTIFACT}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-agentd-${{ github.ref_name }}-${{ matrix.target }}
          path: wist-agentd-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-matrix, test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wist-agentd-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # alpha/beta 通道标为 prerelease（不占 “latest”）；stable 才是正式版。
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

  # 可选：把本仓制品推到腾讯云 COS（对象存储），供中心 / CDN / 客户端按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整段自动跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-guangzhou）、可选 COS_PREFIX（默认取仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：<COS_PREFIX>/<tag>/<文件名> 与 <COS_PREFIX>/latest/<文件名>
  # 每个对象带自定义元数据 x-cos-meta-artifact-sha256=<hex>（COS 只存 MD5 ETag，sha256 得自带）。
  upload-cos:
    name: Upload artifacts to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          # coscli 只打印汇总，失败明细落在 coscli_output/<时间>/ 下；失败时打印并输出为 annotation。
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          shopt -s nullglob
          files=(pkg/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            name="$(basename "${f}")"
            # COS 对象只存 MD5（ETag），GitHub 侧资产 digest（sha256）过不来。把 sha256 作为
            # **对象自定义元数据**写进对象本身（x-cos-meta-artifact-sha256 —— 与设计里的
            # artifact_sha256 字段同名）—— 随对象走，录 COS 地址时可用 `coscli stat`（HEAD）
            # 读回填 expected_sha256（`ls` 不返回自定义元数据）。--meta 形如 key:value（多个用 # 分隔）。
            # 本 step 只有 `set -eu`（无 pipefail），管道失败会被 cut 吃掉；空摘要等于又「丢」了，
            # 故显式兜一道。
            sha="$(sha256sum "${f}" | cut -d' ' -f1)"
            [ -n "${sha}" ] || { echo "::error::无法计算 ${name} 的 sha256" >&2; exit 1; }
            meta="x-cos-meta-artifact-sha256:${sha}"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/${TAG}/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（${TAG}）"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/latest/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（latest）"
            echo "已上传 ${name}  sha256=${sha}"
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"
